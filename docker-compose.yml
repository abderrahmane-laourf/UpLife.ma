services:
  db:
    image: postgres:16-alpine
    container_name: uplife-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: uplife
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
